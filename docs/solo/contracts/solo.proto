syntax = "proto3";
package solo.v1;
// Contract only. Run buf/protoc code generation and cross-language tests in D-002.
// TransactionEnvelope bytes have strict canonical-wire validation BEFORE decode.
message TransactionEnvelope {
  uint32 envelope_version = 1; // MUST equal 1; explicit canonical wire encoding.
  bytes canonical_body = 2;   // Canonical CBOR defined in tx_body.cddl.
  repeated bytes proofs = 3;  // Spend order then Output order; hash-bound in body.
  repeated Authorization authorizations = 4;
  bytes binding_signature = 5; // frozen upstream signature encoding, NOT custom curve.
}
message Authorization {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    SPEND = 1;
    POSITION_OWNER = 2;
    OPERATOR = 3;
    CONSENSUS_POP = 4;
    GENESIS_CLAIM = 5;
  }
  Role role = 1;
  uint32 index = 2; // Spend index, otherwise 0. Zero omitted canonically.
  bytes signature = 3;
}
message ChainMeta {
  uint32 protocol_version = 1;
  string chain_context_hex = 2;
  uint64 state_height = 3;
  uint64 verified_header_height = 4; // server claim; client MUST verify.
}
message ProofValue {
  bytes key = 1;
  bool exists = 2;
  bytes value = 3;
  string proof_format = 4;
  uint32 proof_version = 5;
  bytes state_proof = 6;
  bytes app_hash = 7;
  bytes verified_header_hash = 8;
}
message HeaderBundle {
  uint64 height = 1;
  bytes signed_header_proto = 2; // exact CometBFT 0.38 types in pinned manifest.
  bytes validator_set_proto = 3;
  bytes next_validator_set_proto = 4;
}
message CompactBlock {
  uint64 height = 1;
  bytes canonical_records = 2;
  bytes records_hash = 3;
  ProofValue commitment_proof = 4;
  uint32 format_version = 5;
}
message HeadersRequest { uint64 from_height = 1; uint32 limit = 2; }
message HeadersResponse { ChainMeta meta = 1; repeated HeaderBundle items = 2; uint64 next_height = 3; }
message CompactBlocksRequest { uint64 from_height = 1; uint32 limit = 2; uint32 max_bytes = 3; }
message CompactBlocksResponse { ChainMeta meta = 1; repeated CompactBlock items = 2; uint64 next_height = 3; bool complete_to_tip = 4; }
message BroadcastRequest { bytes canonical_envelope = 1; }
message BroadcastResponse { ChainMeta meta = 1; bytes tx_id = 2; string status = 3; string code = 4; }
message StateProofRequest { bytes key = 1; uint64 state_height = 2; }
message StateProofResponse { ChainMeta meta = 1; ProofValue result = 2; }
service PublicQuery {
  rpc Headers(HeadersRequest) returns (HeadersResponse);
  rpc CompactBlocks(CompactBlocksRequest) returns (CompactBlocksResponse);
  rpc Broadcast(BroadcastRequest) returns (BroadcastResponse);
  rpc StateProof(StateProofRequest) returns (StateProofResponse);
}
