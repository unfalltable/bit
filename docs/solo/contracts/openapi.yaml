components:
  schemas:
    UIntString:
      type: string
      description: 规范非负十进制；客户端使用BigInt，不经Number。
      pattern: ^(0|[1-9][0-9]*)$
    Amount:
      type: string
      description: 原子单位十进制字符串；语义校验0<=x<2^120。
      pattern: ^(0|[1-9][0-9]{0,36})$
    Hash:
      type: string
      pattern: ^[0-9a-f]{64}$
    Base64:
      type: string
      format: byte
      maxLength: 12000000
    Meta:
      type: object
      additionalProperties: false
      properties:
        protocol_version:
          type: integer
          enum:
          - 1
        chain_context:
          $ref: '#/components/schemas/Hash'
        state_height:
          $ref: '#/components/schemas/UIntString'
        verified_header_height:
          $ref: '#/components/schemas/UIntString'
      required:
      - protocol_version
      - chain_context
      - state_height
      - verified_header_height
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
          description: 只含脱敏消息
        retryable:
          type: boolean
        request_id:
          type: string
        details:
          type: object
          additionalProperties: false
          properties:
            required_state_height:
              $ref: '#/components/schemas/UIntString'
          required: []
      required:
      - code
      - message
      - retryable
      - request_id
      - details
    StateProof:
      type: object
      additionalProperties: false
      properties:
        key_base64:
          $ref: '#/components/schemas/Base64'
        exists:
          type: boolean
        value_base64:
          $ref: '#/components/schemas/Base64'
        proof_format:
          type: string
        proof_version:
          type: integer
          minimum: 1
        proof_base64:
          $ref: '#/components/schemas/Base64'
        app_hash:
          $ref: '#/components/schemas/Hash'
        header_hash:
          $ref: '#/components/schemas/Hash'
      required:
      - key_base64
      - exists
      - value_base64
      - proof_format
      - proof_version
      - proof_base64
      - app_hash
      - header_hash
    Header:
      type: object
      additionalProperties: false
      properties:
        height:
          $ref: '#/components/schemas/UIntString'
        signed_header_base64:
          $ref: '#/components/schemas/Base64'
        validator_set_base64:
          $ref: '#/components/schemas/Base64'
        next_validator_set_base64:
          $ref: '#/components/schemas/Base64'
      required:
      - height
      - signed_header_base64
      - validator_set_base64
      - next_validator_set_base64
    Network:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        chain_id:
          type: string
        genesis_manifest_hash:
          $ref: '#/components/schemas/Hash'
        native_asset_id:
          $ref: '#/components/schemas/Hash'
        decimals:
          type: integer
          enum:
          - 8
        privacy_required:
          type: boolean
        crypto_manifest_hash:
          $ref: '#/components/schemas/Hash'
        params_hash:
          $ref: '#/components/schemas/Hash'
        max_compact_batch_bytes:
          type: integer
          minimum: 1
      required:
      - meta
      - chain_id
      - genesis_manifest_hash
      - native_asset_id
      - decimals
      - privacy_required
      - crypto_manifest_hash
      - params_hash
      - max_compact_batch_bytes
    Headers:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Header'
          maxItems: 500
        next_height:
          $ref: '#/components/schemas/UIntString'
      required:
      - meta
      - items
      - next_height
    CompactBlock:
      type: object
      additionalProperties: false
      properties:
        height:
          $ref: '#/components/schemas/UIntString'
        format_version:
          type: integer
          enum:
          - 1
        records_base64:
          $ref: '#/components/schemas/Base64'
        records_hash:
          $ref: '#/components/schemas/Hash'
        commitment_proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - height
      - format_version
      - records_base64
      - records_hash
      - commitment_proof
    CompactBlocks:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompactBlock'
          maxItems: 500
        next_height:
          $ref: '#/components/schemas/UIntString'
        complete_to_tip:
          type: boolean
      required:
      - meta
      - items
      - next_height
      - complete_to_tip
    BroadcastRequest:
      type: object
      additionalProperties: false
      properties:
        envelope_base64:
          type: string
          format: byte
          maxLength: 87384
      required:
      - envelope_base64
    BroadcastReceipt:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        tx_id:
          $ref: '#/components/schemas/Hash'
        status:
          type: string
          enum:
          - RECEIVED
          - MEMPOOL
          - CONFIRMED
          - UNKNOWN
          - REJECTED
        code:
          type: string
        confirmation:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - tx_id
      - status
      - code
    TransactionStatus:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        tx_id:
          $ref: '#/components/schemas/Hash'
        status:
          type: string
          enum:
          - UNKNOWN
          - MEMPOOL
          - MEMPOOL_EVICTED
          - CONFIRMED
          - REJECTED
          - EXPIRED
        block_height:
          $ref: '#/components/schemas/UIntString'
        transaction_index:
          type: integer
          minimum: 0
        execution_code:
          type: string
        canonical_envelope_base64:
          $ref: '#/components/schemas/Base64'
        inclusion_proof_base64:
          $ref: '#/components/schemas/Base64'
        result_proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - tx_id
      - status
    Validator:
      type: object
      additionalProperties: false
      properties:
        validator_id:
          $ref: '#/components/schemas/Hash'
        operator_pubkey:
          $ref: '#/components/schemas/Hash'
        consensus_pubkey:
          $ref: '#/components/schemas/Hash'
        display_name:
          type: string
        status:
          type: string
          enum:
          - REGISTERED
          - ACTIVE
          - INACTIVE
          - JAILED
          - DISABLED
          - TOMBSTONED
        pool_generation:
          $ref: '#/components/schemas/UIntString'
        pool_assets:
          $ref: '#/components/schemas/Amount'
        pool_shares:
          $ref: '#/components/schemas/Amount'
        self_bond_value:
          $ref: '#/components/schemas/Amount'
        voting_power:
          $ref: '#/components/schemas/UIntString'
        commission_bps:
          type: integer
          minimum: 0
          maximum: 2000
        sequence:
          $ref: '#/components/schemas/UIntString'
        proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - validator_id
      - operator_pubkey
      - consensus_pubkey
      - display_name
      - status
      - pool_generation
      - pool_assets
      - pool_shares
      - self_bond_value
      - voting_power
      - commission_bps
      - sequence
      - proof
    Validators:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Validator'
          maxItems: 500
        next_cursor:
          type: string
      required:
      - meta
      - items
    ValidatorResponse:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        validator:
          $ref: '#/components/schemas/Validator'
      required:
      - meta
      - validator
    Position:
      type: object
      additionalProperties: false
      properties:
        position_id:
          $ref: '#/components/schemas/Hash'
        owner_pubkey:
          $ref: '#/components/schemas/Hash'
        validator_id:
          $ref: '#/components/schemas/Hash'
        generation:
          $ref: '#/components/schemas/UIntString'
        shares:
          $ref: '#/components/schemas/Amount'
        pending_amount:
          $ref: '#/components/schemas/Amount'
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REFUNDABLE_PENDING
          - EXITED
          - INSOLVENT
        sequence:
          $ref: '#/components/schemas/UIntString'
        created_height:
          $ref: '#/components/schemas/UIntString'
        receipt_base64:
          $ref: '#/components/schemas/Base64'
        proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - position_id
      - owner_pubkey
      - validator_id
      - generation
      - shares
      - pending_amount
      - status
      - sequence
      - created_height
      - receipt_base64
      - proof
    PositionResponse:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        position:
          $ref: '#/components/schemas/Position'
      required:
      - meta
      - position
    ExitTicket:
      type: object
      additionalProperties: false
      properties:
        ticket_id:
          $ref: '#/components/schemas/Hash'
        position_id:
          $ref: '#/components/schemas/Hash'
        cohort_id:
          $ref: '#/components/schemas/Hash'
        units:
          $ref: '#/components/schemas/Amount'
        sequence:
          $ref: '#/components/schemas/UIntString'
        current_gross_value:
          $ref: '#/components/schemas/Amount'
        exposure_end_height:
          $ref: '#/components/schemas/UIntString'
        exposure_end_time:
          type: string
          format: date-time
        maturity_height_exclusive:
          $ref: '#/components/schemas/UIntString'
        maturity_time_exclusive:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - WAITING_EXPOSURE_END
          - LOCKED
          - SLASH_PENDING
          - MATURE
          - CLAIMED
        proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - ticket_id
      - position_id
      - cohort_id
      - units
      - sequence
      - current_gross_value
      - exposure_end_height
      - status
      - proof
    ExitTicketResponse:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        ticket:
          $ref: '#/components/schemas/ExitTicket'
      required:
      - meta
      - ticket
    Supply:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        total:
          $ref: '#/components/schemas/Amount'
        genesis:
          $ref: '#/components/schemas/Amount'
        minted:
          $ref: '#/components/schemas/Amount'
        burned:
          $ref: '#/components/schemas/Amount'
        shielded_pool:
          $ref: '#/components/schemas/Amount'
        stake_pools:
          $ref: '#/components/schemas/Amount'
        pending_delegation:
          $ref: '#/components/schemas/Amount'
        exit_pools:
          $ref: '#/components/schemas/Amount'
        commission_payable:
          $ref: '#/components/schemas/Amount'
        fee_reserve:
          $ref: '#/components/schemas/Amount'
        unclaimed_genesis:
          $ref: '#/components/schemas/Amount'
        proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - total
      - genesis
      - minted
      - burned
      - shielded_pool
      - stake_pools
      - pending_delegation
      - exit_pools
      - commission_payable
      - fee_reserve
      - unclaimed_genesis
      - proof
    Fees:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        base:
          $ref: '#/components/schemas/Amount'
        per_kib:
          $ref: '#/components/schemas/Amount'
        per_spend_proof:
          $ref: '#/components/schemas/Amount'
        per_output_proof:
          $ref: '#/components/schemas/Amount'
        new_position_surcharge:
          $ref: '#/components/schemas/Amount'
        validator_registration_surcharge:
          $ref: '#/components/schemas/Amount'
        proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - base
      - per_kib
      - per_spend_proof
      - per_output_proof
      - new_position_surcharge
      - validator_registration_surcharge
      - proof
    Checkpoint:
      type: object
      additionalProperties: false
      properties:
        chain_context:
          $ref: '#/components/schemas/Hash'
        height:
          $ref: '#/components/schemas/UIntString'
        block_hash:
          $ref: '#/components/schemas/Hash'
        validators_hash:
          $ref: '#/components/schemas/Hash'
        issued_at:
          type: string
          format: date-time
        signatures:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              signer_id:
                $ref: '#/components/schemas/Hash'
              signature_base64:
                $ref: '#/components/schemas/Base64'
            required:
            - signer_id
            - signature_base64
          maxItems: 16
      required:
      - chain_context
      - height
      - block_hash
      - validators_hash
      - issued_at
      - signatures
    Checkpoints:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Checkpoint'
          maxItems: 100
      required:
      - meta
      - items
    StateProofResponse:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        result:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - result
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - OK
          - NOT_READY
        protocol_version:
          type: integer
          enum:
          - 1
        state_height:
          $ref: '#/components/schemas/UIntString'
        verified_header_height:
          $ref: '#/components/schemas/UIntString'
      required:
      - status
      - protocol_version
      - state_height
      - verified_header_height
    BlockSummary:
      type: object
      additionalProperties: false
      properties:
        height:
          $ref: '#/components/schemas/UIntString'
        block_hash:
          $ref: '#/components/schemas/Hash'
        chain_time:
          type: string
          format: date-time
        tx_count:
          type: integer
          minimum: 0
        proposer_id:
          $ref: '#/components/schemas/Hash'
        app_hash:
