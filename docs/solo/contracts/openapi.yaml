      required:
      - height
      - block_hash
      - chain_time
      - tx_count
      - proposer_id
      - app_hash
      - header
    Blocks:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockSummary'
          maxItems: 500
        next_cursor:
          type: string
      required:
      - meta
      - items
    BlockDetail:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        block:
          $ref: '#/components/schemas/BlockSummary'
        transaction_ids:
          type: array
          items:
            $ref: '#/components/schemas/Hash'
          maxItems: 100
        transactions_root:
          $ref: '#/components/schemas/Hash'
        compact_hash_proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - meta
      - block
      - transaction_ids
      - transactions_root
      - compact_hash_proof
    ValidatorEvent:
      type: object
      additionalProperties: false
      properties:
        height:
          $ref: '#/components/schemas/UIntString'
        event_index:
          type: integer
          minimum: 0
        type:
          type: string
        canonical_public_payload_base64:
          $ref: '#/components/schemas/Base64'
        event_proof:
          $ref: '#/components/schemas/StateProof'
      required:
      - height
      - event_index
