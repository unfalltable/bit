[package]
name = "bit-state"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.86"
bincode = "1.3.3"
bit-transaction = { path = "../bit-transaction" }
bit-types = { path = "../bit-types" }
bit-emission = { path = "../bit-emission" }
bit-staking = { path = "../bit-staking" }
cnidarium = { version = "=0.83.0", default-features = false }
decaf377 = "0.10.1"
hex = "0.4.3"
futures = "0.3.34"
ibc-types = { version = "=0.15.1", default-features = false, features = ["std"] }
ics23 = "0.12.0"
penumbra-sdk-tct = { path = "../../feasibility/upstream/penumbra/crates/crypto/tct", default-features = false }
sha2 = "0.10.8"
thiserror = "1.0.63"

[dev-dependencies]
cnidarium = { version = "=0.83.0", default-features = false, features = ["bit-fault-injection"] }
decaf377-rdsa = "0.11.0"
ed25519-consensus = "2.1.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
penumbra-sdk-asset = { path = "../../feasibility/upstream/penumbra/crates/core/asset", default-features = false }
penumbra-sdk-keys = { path = "../../feasibility/upstream/penumbra/crates/core/keys", default-features = false }
penumbra-sdk-num = { path = "../../feasibility/upstream/penumbra/crates/core/num", default-features = false }
penumbra-sdk-proof-params = { path = "../../feasibility/upstream/penumbra/crates/crypto/proof-params", default-features = false }
penumbra-sdk-proto = { path = "../../feasibility/upstream/penumbra/crates/proto", default-features = false }
penumbra-sdk-sct = { path = "../../feasibility/upstream/penumbra/crates/core/component/sct", default-features = false }
penumbra-sdk-shielded-pool = { path = "../../feasibility/upstream/penumbra/crates/core/component/shielded-pool", default-features = false, features = ["std", "parallel"] }
tempfile = "3.10.1"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
