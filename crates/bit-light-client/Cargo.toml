[package]
name = "bit-light-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bit-types = { path = "../bit-types" }
ed25519-consensus = "2.1.0"
ibc-types = { version = "=0.15.1", default-features = false, features = ["std"] }
ics23 = "0.12.0"
jmt = { version = "0.11.0", default-features = false, features = ["ics23", "std"] }
prost = "0.13.5"
serde_json = "1.0.117"
sha2 = "0.10.8"
tendermint = { version = "=0.40.4", features = ["rust-crypto"] }
tendermint-light-client-verifier = "=0.40.4"
thiserror = "1.0.63"

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
tendermint-testgen = "=0.40.4"
