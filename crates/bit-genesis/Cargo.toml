[package]
name = "bit-genesis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bit"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bit-emission = { path = "../bit-emission" }
bit-light-client = { path = "../bit-light-client" }
bit-staking = { path = "../bit-staking" }
bit-state = { path = "../bit-state" }
bit-types = { path = "../bit-types" }
ed25519-consensus = "2.1.0"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["raw_value"] }
sha2 = "0.10.8"
tempfile = "3.10.1"
thiserror = "1.0.63"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
