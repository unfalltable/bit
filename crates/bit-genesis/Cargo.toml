[package]
name = "bit-genesis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bit"
path = "src/main.rs"

[dependencies]
bit-types = { path = "../bit-types" }
ed25519-consensus = "2.1.0"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
thiserror = "1.0.63"

[dev-dependencies]
tempfile = "3.10.1"
