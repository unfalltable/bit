[package]
name = "bit-proof-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
bit-shielded = { path = "../../crates/bit-shielded" }
bit-emission = { path = "../../crates/bit-emission" }
bit-transaction = { path = "../../crates/bit-transaction" }
bit-types = { path = "../../crates/bit-types" }
decaf377 = "0.10.1"
decaf377-rdsa = "0.11.0"
ed25519-consensus = "2.1.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
penumbra-sdk-asset = { path = "../upstream/penumbra/crates/core/asset", default-features = false }
penumbra-sdk-keys = { path = "../upstream/penumbra/crates/core/keys", default-features = false }
penumbra-sdk-num = { path = "../upstream/penumbra/crates/core/num", default-features = false }
penumbra-sdk-proto = { path = "../upstream/penumbra/crates/proto", default-features = false }
penumbra-sdk-proof-params = { path = "../upstream/penumbra/crates/crypto/proof-params", default-features = false }
penumbra-sdk-sct = { path = "../upstream/penumbra/crates/core/component/sct", default-features = false }
penumbra-sdk-shielded-pool = { path = "../upstream/penumbra/crates/core/component/shielded-pool", default-features = false, features = ["std", "parallel"] }
penumbra-sdk-tct = { path = "../upstream/penumbra/crates/crypto/tct", default-features = false }

[profile.release]
overflow-checks = true
