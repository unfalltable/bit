[workspace]
members = [
    "crates/bit-types",
    "crates/bit-genesis",
    "crates/bit-shielded",
    "crates/bit-transaction",
    "crates/bit-emission",
    "crates/bit-staking",
    "crates/bit-state",
    "crates/bit-app",
    "crates/bit-gateway",
]
exclude = ["feasibility/proof-probe", "feasibility/consensus-probe", "feasibility/upstream/penumbra", "third_party/cnidarium"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"

[profile.release]
overflow-checks = true
lto = "thin"

[patch.crates-io]
cnidarium = { path = "third_party/cnidarium" }
